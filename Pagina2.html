<div class="container mt-5">
    <h1 class="text-center mb-4">Formulario de Clientes</h1>
    <div class="row justify-content-center">
    <div class="col-md-6">
        <form id="formulario" onsubmit="enviarFormulario(event)">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre">
        </div>
        <div class="mb-3">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="apellido">
        </div>
        <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" oninput="habilitarBoton()">
        </div>
        <div class="mb-3">
            <label for="edad" class="form-label">Edad</label>
            <input type="number" class="form-control" id="edad" onchange="validarEdad()">
        </div>
        <button type="submit" class="btn btn-primary" id="enviar" disabled>Enviar</button>
        </form>
    </div>
    </div>
</div>

    <div id="resultado"></div>
</div>
